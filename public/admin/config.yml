backend:
  name: git-gateway
  branch: main # Adjust to your publication branch

media_folder: "public/images/uploads" # Path to save media files in the repo
public_folder: "/images/uploads" # Path to access media files in the site

collections:
  - name: "nouvelles_arrivage" # Used in routes, e.g., /admin/collections/nouvelles_arrivage
    label: "Nouvelles Arrivage" # Used in the UI
    folder: "_posts/nouvelles_arrivage" # Path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    slug: "{{year}}-{{month}}-{{day}}-{{title}}" # Filename template, e.g., YYYY-MM-DD-title.md
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "nouvelles_arrivage" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "thumbnail", widget: "image" }
      - { label: "Body", name: "body", widget: "markdown" }
